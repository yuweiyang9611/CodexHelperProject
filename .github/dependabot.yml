version: 2

# CI generates the shipped inventory from the published .NET sidecar, the Web
# production dependencies and the installed Electron runtime. If a dependency
# update changes the inventory or notices, review the patch attached to the CI
# run and commit the regenerated files.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Test tooling moves together and never touches the shipped inventory.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: npm
    directory: /src/CodexU.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped so the toolchain lands as one reviewable PR; all dev-only, so
      # the shipped inventory is unaffected.
      web-tooling:
        dependency-type: development
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "vue-tsc"
          - "happy-dom"
      playwright:
        dependency-type: development
        patterns:
          - "@playwright/*"
          - "@axe-core/*"

  - package-ecosystem: npm
    directory: /src/CodexU.Electron
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron-runtime:
        patterns:
          - "electron"
          - "@electron/fuses"
      electron-forge:
        patterns:
          - "@electron-forge/*"
      electron-tooling:
        dependency-type: development
        patterns:
          - "typescript"
          - "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
