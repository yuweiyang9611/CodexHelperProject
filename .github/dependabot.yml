version: 2

# Note: CI regenerates THIRD-PARTY-INVENTORY.md and fails on any diff. The
# inventory currently covers the shipped WPF dependencies (NuGet packages
# reaching CodexU.App, plus the Vue production graph). Electron is built only as
# a migration gate for now; its Chromium/runtime notices must be added before
# Electron artifacts are published. A covered production bump needs
# `./tools/Generate-ThirdPartyInventory.ps1` re-run and the result committed.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Test tooling moves together and never touches the shipped inventory.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: npm
    directory: /src/CodexU.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped so the toolchain lands as one reviewable PR; all dev-only, so
      # the shipped inventory is unaffected.
      web-tooling:
        dependency-type: development
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "vue-tsc"
          - "typescript"
          - "happy-dom"
      playwright:
        dependency-type: development
        patterns:
          - "@playwright/*"
          - "@axe-core/*"

  - package-ecosystem: npm
    directory: /src/CodexU.Electron
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron-runtime:
        patterns:
          - "electron"
          - "@electron/fuses"
      electron-forge:
        patterns:
          - "@electron-forge/*"
      electron-tooling:
        dependency-type: development
        patterns:
          - "typescript"
          - "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
