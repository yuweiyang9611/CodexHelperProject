name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            src/CodexU.Web/package-lock.json
            src/CodexU.Electron/package-lock.json

      - name: Install web dependencies
        working-directory: src/CodexU.Web
        run: npm ci

      - name: Install Electron dependencies
        working-directory: src/CodexU.Electron
        run: npm ci

      - name: Audit Electron dependency graph
        working-directory: src/CodexU.Electron
        run: npm audit --audit-level=high

      - name: Verify Electron dependency policy
        working-directory: src/CodexU.Electron
        run: npm run verify:dependency-policy

      # Runs before the browser download and the .NET build so a broken
      # presentation-layer change fails in seconds rather than minutes.
      - name: Web unit tests
        working-directory: src/CodexU.Web
        run: npm run test:unit

      - name: Electron unit tests
        working-directory: src/CodexU.Electron
        run: npm test

      - name: Install Playwright Chromium
        working-directory: src/CodexU.Web
        run: npx playwright install chromium

      - name: Restore
        run: dotnet restore CodexU.sln

      - name: Verify release automation
        shell: powershell
        run: |
          ./tools/Verify-VersionConsistency.ps1
          ./tools/Verify-ReleaseAutomation.ps1

      - name: Build
        run: dotnet build CodexU.sln --configuration Release --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format CodexU.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test CodexU.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build Electron renderer
        working-directory: src/CodexU.Web
        run: npm run build

      - name: Publish Electron .NET sidecar
        run: dotnet publish src/CodexU.Sidecar/CodexU.Sidecar.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishReadyToRun=false -p:DebugSymbols=false -p:DebugType=None --output src/CodexU.Electron/backend

      - name: Verify third-party inventory
        shell: powershell
        run: |
          ./tools/Generate-ThirdPartyInventory.ps1
          git diff --exit-code -- THIRD-PARTY-INVENTORY.md THIRD-PARTY-LICENSES.txt LICENSES/dotnet-runtime-MIT.txt LICENSES/dotnet-runtime-ThirdPartyNotices.txt

      - name: Package Electron Windows app
        working-directory: src/CodexU.Electron
        run: npm run package

      - name: Smoke-test packaged Electron app
        shell: pwsh
        run: ./tools/Test-PackagedElectron.ps1 -ApplicationDirectory src/CodexU.Electron/out/CodexU-win32-x64

      - name: Visual and accessibility tests
        working-directory: src/CodexU.Web
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Playwright-failure-${{ github.sha }}
          path: |
            src/CodexU.Web/test-results
            src/CodexU.Web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup 6.7.1 (exit $LASTEXITCODE)." }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler was not installed.' }
          $installedVersion = (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion
          if ($installedVersion -notin @('6.7.1', '6.7.1.0')) {
            throw "Expected Inno Setup 6.7.1, found '$installedVersion'."
          }

      - name: Build Electron Windows installer
        shell: pwsh
        env:
          # Must be newer than the real v0.5.0 installer exercised below;
          # otherwise the migration test would be a silent downgrade.
          CODEXU_VERSION: 0.5.1-ci
          CODEXU_NUMERIC_VERSION: 0.5.1
          CODEXU_PUBLISH_DIR: ${{ github.workspace }}\src\CodexU.Electron\out\CodexU-win32-x64
          CODEXU_INSTALLER_OUTPUT_DIR: ${{ github.workspace }}\artifacts\installer
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/installer' | Out-Null
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler 'installer\CodexU.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = Get-Item -LiteralPath 'artifacts/installer/CodexU-0.5.1-ci-win-x64-setup.exe'
          if ($installer.Length -le 0) { throw 'Installer is empty.' }

      - name: Download verified v0.5.0 WPF installer
        shell: pwsh
        run: |
          $legacyDirectory = 'artifacts/legacy'
          $legacyInstaller = Join-Path $legacyDirectory 'CodexU-0.5.0-win-x64-setup.exe'
          New-Item -ItemType Directory -Force -Path $legacyDirectory | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/yuweiyang9611/CodexHelperProject/releases/download/v0.5.0/CodexU-0.5.0-win-x64-setup.exe' `
            -OutFile $legacyInstaller `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2
          $legacyFile = Get-Item -LiteralPath $legacyInstaller
          $legacyHash = (Get-FileHash -LiteralPath $legacyInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyFile.Length -ne 53864409 -or
              $legacyHash -ne '0f01958eeca60ac5ee57658680af5120d55e6dfaa786a8ed30bf76600bbb2b21') {
            throw "Downloaded v0.5.0 installer failed the pinned size/SHA-256 check: $($legacyFile.Length) bytes, $legacyHash"
          }

      - name: Smoke-test Electron Windows installer
        shell: pwsh
        run: |
          ./tools/Test-ElectronInstaller.ps1 `
            -InstallerPath artifacts/installer/CodexU-0.5.1-ci-win-x64-setup.exe `
            -LegacyInstallerPath artifacts/legacy/CodexU-0.5.0-win-x64-setup.exe `
            -ExpectedPackageDirectory src/CodexU.Electron/out/CodexU-win32-x64

      - name: Prepare validated Electron build
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'src/CodexU.Electron/out/CodexU-win32-x64/*' `
            -DestinationPath 'artifacts/installer/CodexU-ci-win-x64.zip' `
            -CompressionLevel Optimal `
            -Force
          if ((Get-Item -LiteralPath 'artifacts/installer/CodexU-ci-win-x64.zip').Length -le 0) {
            throw 'Validated Electron archive is empty.'
          }

      # Pull requests build, install, run and uninstall the exact Electron payload,
      # but do not retain its large Chromium archive. Main/manual runs keep the
      # portable ZIP and installer for short-lived diagnostics.
      - name: Upload validated Electron Windows build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CodexU-win-x64-${{ github.sha }}
          path: artifacts/installer
          if-no-files-found: error
          retention-days: 3
          overwrite: true
